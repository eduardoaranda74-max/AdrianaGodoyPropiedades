<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adriana Godoy Propiedades</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER CON LOGO -->
  <header class="site-header">
    <a href="#">
      <img src="img/logo-banner.png" alt="Adriana Godoy Propiedades" class="header-logo">
    </a>
  </header>

  <!-- CONTENIDO -->
  <div class="container my-5">
    <p class="text-center text-muted mb-3" id="contador"></p>

    <!-- Filtros -->
    <div class="d-flex justify-content-center gap-2 mb-4 flex-wrap">
      <button class="btn btn-filtro filtro-activo" data-filtro="Todas">Todas</button>
      <button class="btn btn-filtro" data-filtro="Venta">Venta</button>
      <button class="btn btn-filtro" data-filtro="Alquiler">Alquiler</button>
    </div>

    <div id="contenedor-propiedades" class="row g-4">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Cargando propiedades...</p>
      </div>
    </div>
  </div>

  <!-- Modal imagen ampliada con navegación -->
  <div class="modal fade" id="modalImagen" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content bg-dark border-0">
        <div class="modal-body p-0 position-relative">
          <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-2 z-3"
                  data-bs-dismiss="modal"></button>
          <span id="contadorModal" class="position-absolute top-0 start-50 translate-middle-x mt-2 text-white small z-3"></span>
          <button id="btnAnteriorModal" onclick="imagenAnterior()" class="btn-nav-modal" style="left:0">&#8249;</button>
          <img id="imagenAmpliada" src="" class="img-fluid w-100 rounded" alt="Imagen ampliada">
          <button id="btnSiguienteModal" onclick="imagenSiguiente()" class="btn-nav-modal" style="right:0">&#8250;</button>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer-custom py-4 mt-5">
    <div class="container text-center text-white">
      <img src="img/logo.png" alt="Logo" height="60" class="logo-nav mb-2">
      <p class="mb-0 small">© 2025 Adriana Godoy Propiedades</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
